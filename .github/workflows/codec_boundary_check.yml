name: JSON Codec Boundary & Tests

on:
  pull_request:
    branches: [ main, feat/Development-Progress-Continues ]
    paths:
      - 'firmware-v3/**'
  push:
    branches: [ main, feat/Development-Progress-Continues ]
    paths:
      - 'firmware-v3/**'

jobs:
  check-codec-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Full history for reliable merge-base diffs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Create dummy WiFi credentials
        working-directory: firmware-v3
        run: |
          cat > wifi_credentials.ini << 'CREDS'
          [wifi_credentials]
          build_flags = -D AP_SSID_CUSTOM=\"CI-Build\"
          CREDS

      - name: Run Codec Tests
        working-directory: firmware-v3
        run: pio test -e native_codec_test_ws

      - name: Guard Native Harness Routes
        working-directory: firmware-v3
        run: python3 scripts/check_native_harness_routes.py
      
      - name: Build Check
        working-directory: firmware-v3
        run: pio run -e esp32dev_audio_esv11_k1v2_32khz
