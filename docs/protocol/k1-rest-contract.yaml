    description: "Set palette for one zone (zoneId 1..3)"
    path_params:
      zoneId: { type: uint8, min: 1, max: 3 }
    request_body:
      paletteId: uint8

  /api/v1/zones/{zoneId}/blend:
    method: POST
    description: "Set blend mode for one zone (zoneId 1..3, blendMode 0..7)"
    path_params:
      zoneId: { type: uint8, min: 1, max: 3 }
    request_body:
      blendMode: uint8

  /api/v1/zones/{zoneId}/enabled:
