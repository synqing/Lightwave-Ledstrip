# LightwaveOS REST API Contract v1
# Source of truth for K1 HTTP API.
# Agents MUST read this before modifying REST routes on K1.
#
# Extracted from firmware-v3/src/network/webserver/V1ApiRoutes.cpp
#
# Rule: update this contract FIRST, implement SECOND.

version: "1.0"
base_url: "http://<k1-ip>/api/v1"
k1_ap_ip: "192.168.4.1"
cors: "Access-Control-Allow-Origin: *"
auth: "Optional X-API-Key header (FEATURE_API_AUTH build flag)"

# ===========================================================================
# System / Discovery
# ===========================================================================
endpoints:

  /api/v1/ping:
    method: GET
    auth: false
    description: "Simple connectivity test"
    response:
      pong: true

  /api/v1/:
    method: GET
    auth: false
    description: "API discovery — lists all available endpoints"

  /api/v1/health:
    method: GET
    auth: false
    description: "System health check"

  /api/v1/openapi.json:
    method: GET
    auth: false
    description: "OpenAPI 3.0.3 specification"

  # ── Device ─────────────────────────────────────────────────────────────
  /api/v1/device/status:
    method: GET
    description: "Device status (uptime, heap, FPS, network, effect state)"
    response_fields:
      fps: { type: uint16, owner: "RendererActor", description: "Renderer FPS derived from rolling average frame time." }
      cpuPercent: { type: uint8, owner: "RendererActor", description: "Renderer frame-budget occupancy: avgFrameTimeUs * 100 / LedConfig::FRAME_TIME_US, clamped to 100. Not whole-device CPU utilisation and not the audio benchmark load metric." }
      framesRendered: { type: uint32, owner: "RendererActor", description: "Rendered frame counter since renderer start." }
    consumers: [ios]

  /api/v1/device/info:
    method: GET
    description: "Hardware/firmware info (chip, flash, sketch size)"
    consumers: [ios]

  /api/v1/device/ota-token:
    method: GET
    description: "Get OTA authentication token"

  /api/v1/device/ota-token:
    method: POST
    description: "Generate or rotate OTA token"

  # ── Render Output ──────────────────────────────────────────────────────
  /api/v1/render/dithering:
    method: GET
    description: "Get LED output temporal dithering state"
    response:
      enabled: bool
    consumers: [ios, tab5]

  /api/v1/render/dithering:
    method: POST
    description: "Enable or disable LED output temporal dithering"
    body:
      enabled: { type: bool, required: true }
    response:
      enabled: bool
    consumers: [ios, tab5]

  # ── Effects ────────────────────────────────────────────────────────────
  /api/v1/effects:
    method: GET
    description: "Paginated list of all effects"
    query_params:
      page: { type: uint8, optional: true, default: 1 }
      limit: { type: uint8, optional: true, default: 20 }
    response_item_fields:
      id: uint16
      name: string
      category: "string or null"
      categoryId: "uint8 or null"
      isAudioReactive: bool
      isExperimental: { type: bool, note: "absent on old firmware = false" }
      # isExperimental=true: effect tagged for exclusion from default production
      # rotation; iOS filters these out in filteredEffects() by default.
    consumers: [ios]

  /api/v1/effects/current:
    method: GET
    description: "Current active effect with parameters"
    consumers: [ios]

  /api/v1/effects/current:
    method: PUT
    description: "Set current effect (compat alias for /effects/set)"
    body:
      effectId: { type: uint16, required: true }
    consumers: [ios]

  /api/v1/effects/set:
    method: POST
    description: "Set active effect by ID"
    body:
      effectId: { type: uint16, required: true }
      transition: { type: bool, optional: true }
      transitionType: { type: uint8, optional: true }
    consumers: [ios]

  /api/v1/effects/metadata:
    method: GET
    description: "Effect metadata (family, story, optical intent, isExperimental)"
    response_fields:
      isExperimental: { type: bool, note: "absent on old firmware = false" }
    query_params:
      id: { type: uint16, required: true }
    consumers: [ios]

  /api/v1/effects/parameters:
    method: GET
    description: "Get IEffect plugin parameters for an effect"
    query_params:
      id: { type: uint16, optional: true, note: "defaults to current effect" }
    consumers: [ios]

  /api/v1/effects/parameters:
    method: [POST, PATCH]
    description: "Set IEffect plugin parameters"
    body:
      effectId: { type: uint16, optional: true }
      parameters: { type: object, required: true }
    consumers: [ios]

  /api/v1/effects/families:
    method: GET
    description: "List all effect families and counts"
    consumers: [ios]

  # ── Parameters ─────────────────────────────────────────────────────────
  /api/v1/parameters:
    method: GET
    description: "Get all global renderer parameters"
    consumers: [ios]

  /api/v1/parameters:
    method: [POST, PATCH]
    description: "Set global parameters (partial update)"
    body:
      brightness: { type: uint8, optional: true, range: "0-255" }
      speed: { type: uint8, optional: true, range: "1-100" }
      paletteId: { type: uint8, optional: true }
      hue: { type: uint8, optional: true, range: "0-255" }
      intensity: { type: uint8, optional: true, range: "0-255" }
      saturation: { type: uint8, optional: true, range: "0-255" }
      complexity: { type: uint8, optional: true, range: "0-255" }
      variation: { type: uint8, optional: true, range: "0-255" }
      mood: { type: uint8, optional: true, range: "0-255", description: "REST only" }
      fadeAmount: { type: uint8, optional: true, description: "REST only" }
    consumers: [ios]

  # ── SynqMatrix Director ──────────────────────────────────────────────────
  # Canonical paths: /api/v1/synqmatrix/*. Legacy /api/v1/songAware/* aliases
  # coexist for one release; both routes invoke the same handler.
  /api/v1/songAware/config:
    method: GET
    description: "Get runtime-only SynqMatrix configuration. Mode is the authority boundary; profile is aggression. No NVS persistence."
    deprecated: true
    alias_of: "/api/v1/synqmatrix/config"
    note: "Deprecated 2026-05-13 — use /api/v1/synqmatrix/config canonical name. Both names route to the same handler. Aliases removed at the same firmware release that ships the SynqMatrix algorithmic contract."
    response:
      enabled: bool
      mode: { type: string, enum: [off, assist, director] }
      profile: { type: string, enum: [subtle, balanced, high] }
      switchingEnabled: bool
      familyMorphing: { type: bool, deprecated: true, note: "Accepted for compatibility; unsupported." }
      constrainedSwitching: { type: bool, deprecated: true, note: "Alias of switchingEnabled for one release." }
      sensitivity: { type: float, range: "0.0-1.0" }
      intensityScalar: { type: float, range: "0.0-1.0" }
      motionScalar: { type: float, range: "0.0-1.0" }
      confidenceFloor: { type: float, range: "0.0-1.0" }
    consumers: [ios, tab5, lab]

  /api/v1/synqmatrix/config:
    method: GET
    description: "Get runtime-only SynqMatrix configuration. Mode is the authority boundary; profile is aggression. No NVS persistence."
    response:
      enabled: bool
      mode: { type: string, enum: [off, assist, director] }
      profile: { type: string, enum: [subtle, balanced, high] }
      switchingEnabled: bool
      familyMorphing: { type: bool, deprecated: true, note: "Accepted for compatibility; unsupported." }
      constrainedSwitching: { type: bool, deprecated: true, note: "Alias of switchingEnabled for one release." }
      sensitivity: { type: float, range: "0.0-1.0" }
      intensityScalar: { type: float, range: "0.0-1.0" }
      motionScalar: { type: float, range: "0.0-1.0" }
      confidenceFloor: { type: float, range: "0.0-1.0" }
    consumers: [ios, tab5, lab]

  /api/v1/songAware/config:
    method: [POST, PATCH]
    description: "Set runtime-only synq-matrix director configuration, or run a bounded runtime action through the existing config route. No NVS persistence."
    deprecated: true
    alias_of: "/api/v1/synqmatrix/config"
    note: "Deprecated 2026-05-13 — use /api/v1/synqmatrix/config canonical name. Both names route to the same handler. Aliases removed at the same firmware release that ships the SynqMatrix algorithmic contract."
    body:
      action: { type: string, optional: true, enum: [reset, wipe, restore, countersReset, counters_reset], note: "When present, runs the action instead of applying config fields. reset is a compatibility alias for wipe." }
      enabled: { type: bool, optional: true }
      mode: { type: string, optional: true, enum: [off, assist, director], compatibility: "on and parameter map to assist; subtle/balanced/high set profile and map mode to assist for one release." }
      profile: { type: string, optional: true, enum: [subtle, balanced, high] }
      switchingEnabled: { type: bool, optional: true }
      familyMorphing: { type: bool, optional: true, deprecated: true, note: "Accepted for compatibility; unsupported." }
      constrainedSwitching: { type: bool, optional: true, deprecated: true, note: "Alias of switchingEnabled for one release." }
      sensitivity: { type: float, optional: true, range: "0.0-1.0" }
      intensityScalar: { type: float, optional: true, range: "0.0-1.0" }
      motionScalar: { type: float, optional: true, range: "0.0-1.0" }
      confidenceFloor: { type: float, optional: true, range: "0.0-1.0" }
    response:
      enabled: bool
      mode: string
      profile: string
      switchingEnabled: bool
      familyMorphing: bool
      constrainedSwitching: bool
      sensitivity: float
      intensityScalar: float
      motionScalar: float
      confidenceFloor: float
    consumers: [ios, tab5, lab]

  /api/v1/songAware/status:
    method: GET
    description: "Get runtime synq-matrix director readback for validation. Optional view exposes health/debug/policy/allowlist readbacks without adding extra REST routes."
    deprecated: true
    alias_of: "/api/v1/synqmatrix/status"
    note: "Deprecated 2026-05-13 — use /api/v1/synqmatrix/status canonical name. Both names route to the same handler. Aliases removed at the same firmware release that ships the SynqMatrix algorithmic contract."
    query_params:
      view: { type: string, optional: true, enum: [status, health, debug, policy, allowlist], default: status }
    response:
      enabled: bool
      mode: string
      effectiveMode: string
      profile: string
      owner: string
      suppressedReason: string
      previousSuppressedReason: string
      classificationReason: string
      rawState: string
      previousState: string
      currentState: string
      candidateState: string
      intent: string
      actionPlan: string
      boundaryGate: string
      boundaryReady: bool
      waitingForBoundary: bool
      boundaryConfidence: float
      confidence: float
      selectionScore: float
      lastAction: string
      activeEffectId: uint16
      previousEffectId: uint16
      selectedEffectId: uint16
      selectedFamily: string
      selectedVisualLanguage: string
      lastSwitchReason: string
      parameterUpdates: uint32
      automaticEffectSwitches: uint32
      coasting: bool
      audioConfidenceBelowFloorMs: uint32
      missedPredictionCount: uint32
      tempoWinnerChanges: uint32
      lastDecisionAtMs: uint32
      lastSwitchAtMs: uint32
      stateAgeMs: uint32
      candidateAgeMs: uint32
      candidateHoldRemainingMs: uint32
      dwellRemainingMs: uint32
      cooldownRemainingMs: uint32
      bootGraceRemainingMs: uint32
      enableGraceRemainingMs: uint32
      switchWindowRemainingMs: uint32
      switchesInWindow: uint8
      maxSwitchesPerWindow: uint8
      antiThrashRemainingMs: uint32
      lastSwitchFromEffectId: uint16
      lastSwitchToEffectId: uint16
      transitionActive: bool
      transitionPreviousEffectId: uint16
      transitionTargetEffectId: uint16
      transitionStartedAtMs: uint32
      transitionDurationMs: uint32
      transitionRemainingMs: uint32
      transitionProgress: float
      rms: float
      flux: float
      bpm: float
      audioConfidence: float
      health:
        healthDegraded: bool
        showSkips: uint32
        failures: uint32
        rmtErrors: uint32
        underruns: uint32
        healthCleanForMs: uint32
        healthCleanWindowRemainingMs: uint32
    consumers: [ios, tab5, lab]

  /api/v1/songAware/allowlist:
    method: GET
    description: "Get the runtime mutable state policy allowlist."
    deprecated: true
    alias_of: "/api/v1/synqmatrix/allowlist"
    note: "Deprecated 2026-05-13 — use /api/v1/synqmatrix/allowlist canonical name. Both names route to the same handler. Aliases removed at the same firmware release that ships the SynqMatrix algorithmic contract."
    response:
      count: uint8
      policies: "array of {state,effectId,family,visualLanguage,reason,minConfidence,enabled}"
    consumers: [ios, tab5, lab]

  /api/v1/songAware/allowlist:
    method: PATCH
    description: "Enable or disable a SynqMatrix state policy row at runtime."
    deprecated: true
    alias_of: "/api/v1/synqmatrix/allowlist"
    note: "Deprecated 2026-05-13 — use /api/v1/synqmatrix/allowlist canonical name. Both names route to the same handler. Aliases removed at the same firmware release that ships the SynqMatrix algorithmic contract."
    body:
      state: { type: string, required: true, enum: [unknown, silence, ambient, steady, build, drop, breakdown, dense, transition] }
      enabled: { type: bool, required: true }
    response:
      count: uint8
      policies: "array of {state,effectId,family,visualLanguage,reason,minConfidence,enabled}"
    consumers: [ios, tab5, lab]

  /api/v1/songAware/allowlist/reset:
    method: POST
    description: "Reset the runtime allowlist so all policy rows are enabled."
    deprecated: true
    alias_of: "/api/v1/synqmatrix/allowlist/reset"
    note: "Deprecated 2026-05-13 — use /api/v1/synqmatrix/allowlist/reset canonical name. Both names route to the same handler. Aliases removed at the same firmware release that ships the SynqMatrix algorithmic contract."
    consumers: [ios, tab5, lab]

  # Canonical SynqMatrix entries (mirror the legacy entries above).
