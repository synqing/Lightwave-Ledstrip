  /api/v1/network/sta/enable:
    method: POST
    description: "Enable pure STA mode. Current shipping K1 is AP-only via WIFI_AP_ONLY build flag; this endpoint is gated. Pure-STA path is re-validated through the _sta_validation env; commit 0987ba67 restored AP OR STA semantics. Do NOT use to enable concurrent AP+STA — that is the genuine ESP-IDF 802.11 bug surface. See _FORENSIC_WIFI_REPORT.md."

  /api/v1/network/ap/enable:
    method: POST
    description: "Enable AP mode and persist AP as the preferred boot WiFi mode"

  /api/v1/network/networks:
    method: GET
    description: "List saved networks"

