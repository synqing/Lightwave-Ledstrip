; WeActStudio I2S Speaker Module V1 (MAX98357A) on M5Stack Basic v2.7
; Module: https://github.com/WeActStudio/WeActStudio.I2SSpeakerModuleV1

[env:m5stack-core]
platform = espressif32@6.7.0
board = m5stack-core-esp32
framework = arduino
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_port = /dev/tty.wchusbserial57140442941
monitor_port = /dev/tty.wchusbserial57140442941
build_flags =
    -DCORE_DEBUG_LEVEL=5
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
