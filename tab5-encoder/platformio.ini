; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = wifi_credentials.ini

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_build.partitions = partitions_tab5.csv
monitor_speed = 115200
upload_speed = 1500000
extra_scripts = 
	pre:scripts/pio_pre.py
build_flags = 
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DTAB5_ENCODER_USE_LVGL=1
	-DLV_USE_DRAW_SW_HELIUM=0
	-DLV_USE_DRAW_SW_NEON=0
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_CONF_PATH=\"${PROJECT_SRC_DIR}/ui/lv_conf.h\"
	-ffunction-sections
	-fdata-sections
	; AsyncTCP configuration flags (PRIORITY=5, RUNNING_CORE=0, USE_WDT=0)
	; were temporarily applied as Wave 1 of the forensic-audit remediation
	; to prevent OTA-time watchdog panic but were empirically observed
	; (2026-04-18) to destabilise the WS client on ESP32-P4 + Arduino-core
	; 3.2.1 — pinning AsyncTCP to core 0 appears to cause receive-path
	; starvation against the WiFi driver task, leading to WS disconnects
	; after ~1 frame exchange with K1. Reverted to AsyncTCP library
	; defaults (priority 10, unpinned, WDT subscribed) until a proper fix
	; is identified that preserves OTA stability without breaking steady-
	; state WS. See tab5-encoder/docs/forensic-audit-2026-04-18.md §P0-01.
	${wifi_credentials.build_flags}
lib_deps = 
	https://github.com/M5Stack/M5Unified.git#a625672
	https://github.com/M5Stack/M5GFX.git#53a7184
	robtillaart/M5ROTATE8@0.4.2
	bblanchon/ArduinoJson@^7.0.0
	links2004/WebSockets@^2.4.0
	https://github.com/tobozo/LGFX_PPA
	lvgl/lvgl@^9.3.0
	me-no-dev/ESPAsyncWebServer@^3.0.0
platform_packages = pioarduino/toolchain-riscv32-esp@14.2.0+20241119

[env:tab5_debug]
extends = env:tab5
build_type = debug
debug_tool = esp-builtin
debug_init_break = tbreak setup
debug_speed = 12000
build_flags = 
	${env:tab5.build_flags}
	-DCORE_DEBUG_LEVEL=4
	-Og
	-g3
	-ggdb

[wifi_credentials]
build_flags = 
	-D WIFI_SSID=\"LightwaveOS-AP\"
	-D WIFI_PASSWORD=\"\"

[wifi_sta]
build_flags = 
	-D WIFI_SSID=\"YOUR_WIFI_SSID\"
	-D WIFI_PASSWORD=\"YOUR_WIFI_PASSWORD\"
	-D WIFI_SSID2=\"LightwaveOS-AP\"
	-D WIFI_PASSWORD2=\"\"
	-D WIFI_SSID3=\"LightwaveOS-AP\"
	-D WIFI_PASSWORD3=\"\"
	-D WIFI_SSID4=\"\"
	-D WIFI_PASSWORD4=\"\"
